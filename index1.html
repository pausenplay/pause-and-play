<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pause & Play - Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    /* ==========================================
       1. CSS VARIABLES & CORE SETUP
       ========================================== */
    :root {
      /* Shared Color Palette */
      --brand-primary: #007AFF;
      --brand-glow: rgba(0, 122, 255, 0.35);
      --success-green: #34C759;
      --error-red: #FF3B30;
      
      /* Light Mode Glass Dynamics */
      --bg-gradient: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #e0c3fc, #80d0c7);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 16px 40px rgba(31, 38, 135, 0.12);
      
      --input-bg: rgba(255, 255, 255, 0.5);
      --input-border: rgba(0, 0, 0, 0.1);
      
      --text-main: #1D1D1F;
      --text-sub: #6E6E73;
    }

    /* System Dark Mode Detection */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #0284c7, #1e293b);
        --glass-bg: rgba(18, 18, 20, 0.65);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        
        --input-bg: rgba(255, 255, 255, 0.06);
        --input-border: rgba(255, 255, 255, 0.15);
        
        --text-main: #F5F5F7;
        --text-sub: #A1A1A6;
      }
    }

    /* Force Dark Class Override */
    body.dark {
      --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #0284c7, #1e293b);
      --glass-bg: rgba(18, 18, 20, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-border: rgba(255, 255, 255, 0.15);
      --text-main: #F5F5F7;
      --text-sub: #A1A1A6;
    }

    /* Prevent horizontal scroll bleed across mobile screens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
    }

    /* Continuous Mesh Gradient Motion */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ==========================================
       2. GLASSMORPHIC CARD & ANIMATIONS
       ========================================== */
    .login-wrapper {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      padding: clamp(28px, 6vw, 40px);
      text-align: center;
      
      /* GPU-accelerated enter animation */
      opacity: 0;
      transform: translate3d(0, 30px, 0);
      animation: cardSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardSlideUp {
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    /* Logo Focus Point */
    .logo-container {
      margin-bottom: 24px;
      opacity: 0;
      transform: scale(0.85);
      animation: logoFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto;
      background: var(--brand-primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--brand-glow);
      color: #FFFFFF;
      font-size: 36px;
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* ==========================================
       3. REUSABLE INPUT GROUPS
       ========================================== */
    .input-group {
      position: relative;
      margin-bottom: 18px;
    }

    .input-field {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 44px;
      border-radius: 16px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--text-sub);
      pointer-events: none;
      transition: color 0.25s ease;
    }

    /* Glow on Focus */
    .input-field:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 4px var(--brand-glow);
      background: rgba(255, 255, 255, 0.12);
    }

    .input-field:focus ~ .input-icon {
      color: var(--brand-primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      display: flex;
    }

    /* ==========================================
       4. BUTTONS & RIPPLE EFFECT
       ========================================== */
    .btn-submit {
      position: relative;
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border-radius: 16px;
      border: none;
      background: var(--brand-primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px var(--brand-glow);
      transition: transform 0.15s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Ripple Element */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      background: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Spinner State */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success Check Overlay */
    .btn-submit.success {
      background: var(--success-green) !important;
      box-shadow: 0 8px 20px rgba(52, 199, 89, 0.35);
    }

    /* Feedback Message Container */
    .feedback-msg {
      margin-top: 18px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--error-red);
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .feedback-msg.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="login-wrapper">
    <div class="glass-card">
      
      <!-- Focal Point Logo -->
      <div class="logo-container">
        <div class="logo-badge">
          <i class="bx bx-game"></i>
        </div>
      </div>

      <h1 class="brand-title">Pause & Play</h1>
      <p class="subtitle">Management System</p>

      <form id="loginForm" autocomplete="off" novalidate>
        
        <!-- Username Input -->
        <div class="input-group">
          <input 
            type="text" 
            id="username" 
            class="input-field" 
            placeholder="Username" 
            autocomplete="username" 
            required>
          <i class="bx bx-user input-icon"></i>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <input 
            type="password" 
            id="password" 
            class="input-field" 
            placeholder="Password" 
            autocomplete="current-password" 
            required>
          <i class="bx bx-lock-alt input-icon"></i>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <i class="bx bx-show" id="eyeIcon"></i>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Sign In</span>
        </button>

      </form>

      <div id="feedbackMsg" class="feedback-msg"></div>

    </div>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const feedbackMsg = document.getElementById("feedbackMsg");
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const eyeIcon = document.getElementById("eyeIcon");

      // 1. Password Visibility Toggle
      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.className = isPassword ? "bx bx-hide" : "bx bx-show";
      });

      // 2. Ripple Animation Engine
      submitBtn.addEventListener("click", function (e) {
        const circle = document.createElement("span");
        const diameter = Math.max(this.clientWidth, this.clientHeight);
        const radius = diameter / 2;
        const rect = this.getBoundingClientRect();

        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add("ripple");

        const existingRipple = this.querySelector(".ripple");
        if (existingRipple) existingRipple.remove();

        this.appendChild(circle);
      });

      // 3. Form Submission & State Machine
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const username = document.getElementById("username").value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          showError("Please enter both username and password");
          return;
        }

        setLoadingState(true);

        try {
          let response = null;

          // Attempt API authentication if the service function exists
          if (typeof login === "function") {
            response = await login(username, password);
          }

          if (response && response.success) {
            triggerSuccessSequence(response.user || { username });
          } else if (username === "admin" && password === "1234") {
            // Local Offline Fallback
            triggerSuccessSequence({ username: "admin", role: "OWNER" });
          } else {
            setLoadingState(false);
            showError(response?.message || "Invalid Username or Password");
          }
        } catch (err) {
          console.error("Login exception:", err);
          setLoadingState(false);
          showError("Unable to connect to service. Please try again.");
        }
      });

      function setLoadingState(isLoading) {
        submitBtn.disabled = isLoading;
        feedbackMsg.classList.remove("visible");
        if (isLoading) {
          btnText.style.display = "none";
          btnSpinner.style.display = "inline-block";
        } else {
          btnText.style.display = "inline";
          btnSpinner.style.display = "none";
        }
      }

      function showError(message) {
        feedbackMsg.textContent = message;
        feedbackMsg.classList.add("visible");
      }

      function triggerSuccessSequence(userData) {
        // Persist session tokens
        sessionStorage.setItem("gym_user", JSON.stringify(userData));
        localStorage.setItem("loggedIn", "true");

        // Render Success Animation
        btnSpinner.style.display = "none";
        submitBtn.classList.add("success");
        btnText.innerHTML = '<i class="bx bx-check" style="font-size: 24px;"></i>';
        btnText.style.display = "inline";

        // Smooth transition to target workspace
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      }
    });
  </script>
</body>
</html>
