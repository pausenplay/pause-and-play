<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<script>

if(localStorage.getItem("loggedIn")!="true"){

location.href="login.html";

}

</script>

<header class="topbar">

<div class="logo">

<img src="assets/logo.png" height="45">

<span>Pause & Play</span>

</div>

<div>

<button onclick="window.open('billing.html','_blank')">
💳 Billing
</button>

<button onclick="logout()">
Logout
</button>

</div>

</header>

<div class="container">

<h1>Dashboard</h1>

<div class="grid">

<div class="card">
<h3>Total Members</h3>
<h1 id="total">0</h1>
</div>

<div class="card">
<h3>Active Members</h3>
<h1 id="active">0</h1>
</div>

<div class="card">
<h3>Today's Attendance</h3>
<h1 id="today">0</h1>
</div>

<div class="card">
<h3>Expired Members</h3>
<h1 id="expired">0</h1>
</div>

</div>

<br>

<div class="grid">

<button onclick="location.href='addmember.html'">
➕ Add Member
</button>

<button onclick="location.href='members.html'">
👥 Members
</button>

<button onclick="location.href='scanner.html'">
📷 Scan QR
</button>

<button onclick="location.href='attendance.html'">
📅 Attendance
</button>

<button onclick="location.href='reports.html'">
📊 Reports
</button>

<button onclick="location.href='settings.html'">
⚙ Settings
</button>

</div>

</div>

<script src="api.js"></script>

<script>

async function loadDashboard(){

let d=await getDashboard();

total.innerHTML=d.total||0;

active.innerHTML=d.active||0;

today.innerHTML=d.today||0;

expired.innerHTML=d.expired||0;

}

function logout(){

localStorage.removeItem("loggedIn");

location.href="login.html";

}

loadDashboard();

</script>

</body>

</html>
