<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Shanker Medical Agency</title>  
<style>  
    * { box-sizing: border-box; }  
    :root{  
        --green:#8fe044;  
        --green-dark:#70b72d;  
        --border:#111;  
        --light:#f7f7f7;  
        --gray:#dcdcdc;  
    }  

    body{  
        margin:0;  
        background:#000;  
        font-family:Arial, Helvetica, sans-serif;  
        color:#000;  
    }  

    .app{  
        width:min(100%, 760px);  
        margin:0 auto;  
        min-height:100vh;  
        background:#fff;  
        overflow:hidden;  
    }  

    .page{  
        display:none;  
        min-height:100vh;  
        padding:20px;  
    }  

    .page.active{ display:block; }  

    .brand{  
        text-align:center;  
        font-size:24px;  
        font-weight:800;  
        letter-spacing:-1px;  
        line-height:1.1;  
        margin:5px 0 25px;  
        text-shadow:2px 2px 2px #aaa;  
    }  

    .field{  
        width:100%;  
        height:42px;  
        border:2px solid var(--border);  
        border-radius:10px;  
        padding:0 12px;  
        font-size:15px;  
        outline:none;  
        margin-bottom:12px;  
        background:#fff;  
    }  

    .field:focus{  
        border-color:#555;  
        box-shadow:0 0 0 2px #ddd;  
    }  

    .product-select{  
        margin-top:15px;  
        margin-bottom:15px;  
    }  

    .product-list{  
        display:flex;  
        flex-direction:column;  
        gap:12px;  
        max-height:50vh;  
        overflow-y:auto;  
        padding-right:3px;  
    }  

    .product-card{  
        border:2px solid #111;  
        border-radius:10px;  
        padding:12px;  
        background:#fff;  
    }  

    .product-top{  
        display:grid;  
        grid-template-columns:1fr 140px;  
        gap:12px;  
        align-items:center;  
    }  

    .product-name{  
        font-size:16px;  
        font-weight:700;  
        line-height:1.2;  
        word-break:break-word;  
    }  

    .rate{  
        height:38px;  
        border:1.5px solid #777;  
        border-radius:8px;  
        padding:0 10px;  
        width:100%;  
        font-size:14px;  
        font-weight:600;  
        text-align:right;  
    }  

    .rate::placeholder{ color:#bbb; }  

    .product-bottom{  
        display:grid;  
        grid-template-columns:140px 1fr;  
        gap:10px;  
        margin-top:10px;  
        align-items:center;  
    }  

    .qty-field{  
        height:38px;  
        border:1.5px solid #777;  
        border-radius:8px;  
        padding:0 10px;  
        width:100%;  
        font-size:14px;  
        font-weight:600;  
    }  

    .scheme{  
        height:38px;  
        border:1.5px solid #aaa;  
        border-radius:8px;  
        padding:0 10px;  
        font-size:14px;  
        width:100%;  
    }  

    .buttons{  
        display:grid;  
        grid-template-columns:1fr 1fr;  
        gap:20px;  
        margin-top:25px;  
    }  

    button.main-btn{  
        height:48px;  
        border-radius:10px;  
        border:2px solid #999;  
        font-size:18px;  
        font-weight:700;  
        cursor:pointer;  
        box-shadow:inset 0 1px 1px #fff, 0 2px 2px #888;  
    }  

    .clear-btn{ background:#ddd; }  
    .next-btn,.whatsapp-btn{ background:var(--green); }  

    /* Page 2 */  
    #page2{  
        padding:25px 20px;  
    }  

    #page2 .brand{  
        margin-bottom:25px;  
    }  

    .memo-box{  
        border:2px solid #111;  
        border-radius:12px;  
        padding:20px 16px;  
        min-height:500px;  
        font-family:"Courier New", monospace;  
        font-size:14px;  
    }  

    .memo-info{  
        line-height:1.5;  
        white-space:pre-wrap;  
    }  

    .separator{  
        border-top:2px dashed #111;  
        margin:12px 0;  
    }  

    .memo-head{  
        display:grid;  
        grid-template-columns:1fr 100px;  
        font-weight:700;  
        margin-bottom:6px;  
    }  

    .memo-item{  
        margin:6px 0 0;  
    }  

    .memo-main{  
        display:grid;  
        grid-template-columns:minmax(0,1fr) 110px;  
        gap:8px;  
        line-height:1.3;  
    }  

    .memo-product{  
        overflow-wrap:anywhere;  
    }  

    .memo-price{  
        text-align:right;  
    }  

    .memo-remark{  
        font-size:12px;  
        padding-left:2px;  
        margin-bottom:6px;  
        overflow-wrap:anywhere;  
    }  

    .page2-buttons{  
        margin-top:25px;  
    }  

    .empty{  
        text-align:center;  
        color:#777;  
        padding:30px 10px;  
        font-family:Arial, sans-serif;  
        font-size:14px;  
    }  

    @media(max-width:650px){  
        .page{ padding:15px; }  
        .brand{ font-size:20px; margin-bottom:20px; }  
        .product-top,  
        .product-bottom{  
            grid-template-columns:1fr;  
        }  
        .product-bottom{ gap:8px; }  
        .product-list{ max-height:none; }  
        .buttons{ gap:10px; }  
        button.main-btn{ font-size:16px; height:44px; }  
        .memo-box{  
            padding:15px 12px;  
            font-size:13px;  
            min-height:400px;  
        }  
        .memo-main{  
            grid-template-columns:minmax(0,1fr) 90px;  
        }  
    }  
</style>  
</head>  
<body>  
<div class="app">  
    <!-- PAGE 1 -->  
    <section id="page1" class="page active">  
        <div class="brand">SHANKER MEDICAL AGENCY</div>  

        <input id="partyName" class="field" placeholder="PARTY NAME *" autocomplete="off" required>  
        <input id="mobile" class="field" placeholder="MOBILE No. *" inputmode="numeric" maxlength="10" required>  
        <input id="drugLic" class="field" placeholder="Drug Lic." autocomplete="off">  
        <input id="gstin" class="field" placeholder="GSTIN" autocomplete="off">  

        <button type="button" class="main-btn next-btn" style="width:100%;height:42px;font-size:15px;margin:2px 0 12px;" onclick="captureLocation()">  
            Add Location  
        </button>  
        <div id="locationStatus" style="text-align:center;font-size:13px;margin:-6px 0 14px;color:#555;">  
            Location not added  
        </div>  

        <select id="productSelect" class="field product-select">  
            <option value="">Select Product</option>  
        </select>  

        <div id="productList" class="product-list"></div>  

        <div class="buttons">  
            <button class="main-btn clear-btn" onclick="clearAll()">Clear</button>  
            <button class="main-btn next-btn" onclick="goToPage2()">Next</button>  
        </div>  
    </section>  

    <!-- PAGE 2 -->  
    <section id="page2" class="page">  
        <div class="brand">SHANKER MEDICAL AGENCY</div>  

        <div class="memo-box">  
            <div id="memoInfo" class="memo-info"></div>  

            <div class="separator"></div>  

            <div class="memo-head">  
                <div>PRODUCT</div>  
                <div>QTY</div>  
            </div>  

            <div class="separator"></div>  

            <div id="memoItems"></div>  

            <div class="separator"></div>  
            <div>LOCATION</div>  
            <div id="memoLocation" style="margin-top:4px;">Not added</div>  
        </div>  

        <div class="buttons page2-buttons">  
            <button class="main-btn clear-btn" onclick="goToPage1()">Back</button>  
            <button class="main-btn whatsapp-btn" onclick="sendWhatsApp()">Whatsapp</button>  
        </div>  
    </section>  
</div>  

<script>  
const products = [  
    "CASSEROLE O 1500ML",  
    "DICLOWIN ACTIVE CREAM 50G",  
    "DICLOWIN CARBOFAST GEL 15GM",  
    "DICLOWIN CARBOFAST GEL 35GM",  
    "DICLOWIN D3 MANGO NOSHOTS 5ML",  
    "DICLOWIN KNEE OIL 60ML",  
    "DICLOWIN KNEE OIL. 60ML",  
    "DICLOWIN MR SPRAY 25GM",  
    "DICLOWIN MR SPRAY 40GM",  
    "DICLOWIN ORTHO GEL 5GM",  
    "DICLOWIN PERIOD ROLL ON 10ML",  
    "DICLOWIN PLUS 10'S",  
    "DICLOWIN PLUS MR 10'S",  
    "DICLOWIN PLUS SP 10'S",  
    "DICLOWIN ROLL ON 10ML",  
    "HAIR SHEILD SHAMPOO 60ML",  
    "HAIR SHIELD ANTI LICE 30ML",  
    "HAIR SHIELD BIOTIN 60'S",  
    "HANDEEZ BABY 99% WATER WIPES 72'S",  
    "HANDEEZ WIPES 72'S",  
    "HEELMATE 30GM",  
    "KUFMA RED 10'S",  
    "LARLA RABEDSR 10'S",  
    "MILTON OLIVE 200ML",  
    "ORASORE 10'S",  
    "ORASORE DENTAL GEL 10GM",  
    "ORASORE DENTAL+ WHITEPASTE INS 6'S",  
    "ORASORE ELACHIZING SPRAY 15G",  
    "ORASORE GEL 10GM",  
    "ORASORE ORS APPLE 200ML",  
    "ORASORE ORS ORANGE 200ML",  
    "ORASORE PAANZING SPRAY 15GM",  
    "ORASORE STAIN REMOVAL T/P 100GM",  
    "ORASORE SUPER SAUF 15G",  
    "ORASORE WHITENING T/P 50GM",  
    "ORASORE WHITENING T/P 75G",  
    "WINCOLD NASAL SPRAY 10ML",  
    "WINCOLD Z 10'S",  
    "XICOTINE 2 MINT 10'S",  
    "XITCH CR. 15G"  
];  
  
const selectedProducts = new Map();  
let currentLocation = { latitude: "", longitude: "" };  
  
const select = document.getElementById("productSelect");  
const productList = document.getElementById("productList");  
  
products.forEach((name, index) => {  
    const option = document.createElement("option");  
    option.value = String(index);  
    option.textContent = name;  
    select.appendChild(option);  
});  
  
select.addEventListener("change", () => {  
    const index = select.value;  
    if (index === "") return;  
  
    const name = products[Number(index)];  
  
    if (!selectedProducts.has(index)) {  
        selectedProducts.set(index, {  
            name,  
            qty: "1",  
            rate: "",  
            remark: ""  
        });  
        renderProducts();  
    }  
  
    select.value = "";  
});  
  
function renderProducts(){  
    productList.innerHTML = "";  
  
    if (selectedProducts.size === 0) {  
        productList.innerHTML = '<div class="empty">Select a product to add it to the memo.</div>';  
        return;  
    }  
  
    selectedProducts.forEach((item, index) => {  
        const card = document.createElement("div");  
        card.className = "product-card";  
        card.dataset.index = index;  
  
        card.innerHTML = `  
            <div class="product-top">  
                <div class="product-name">${escapeHtml(item.name)}</div>  
                <input  
                    class="rate"  
                    type="number"  
                    min="0"  
                    step="0.01"  
                    placeholder="RATE if any"  
                    value="${item.rate}"  
                    oninput="updateRate('${index}', this.value)"  
                >  
            </div>  
  
            <div class="product-bottom">  
                <input  
                    class="qty-field"  
                    type="text"  
                    placeholder="QTY (e.g. 5, 10 Pcs)"  
                    value="${escapeAttr(item.qty)}"  
                    oninput="updateQty('${index}', this.value)"  
                >  
  
                <input  
                    class="scheme"  
                    placeholder="Remark"  
                    value="${escapeAttr(item.remark)}"  
                    oninput="updateRemark('${index}', this.value)"  
                >  
            </div>  
        `;  
  
        productList.appendChild(card);  
    });  
}  
  
function updateQty(index, value){  
    const item = selectedProducts.get(index);  
    if (item) item.qty = value;  
}  
  
function updateRate(index, value){  
    const item = selectedProducts.get(index);  
    if (item) item.rate = value;  
}  
  
function updateRemark(index, value){  
    const item = selectedProducts.get(index);  
    if (item) item.remark = value;  
}  
  
function clearAll(){  
    if (!confirm("Clear party details and all selected products?")) return;  
  
    document.getElementById("partyName").value = "";  
    document.getElementById("mobile").value = "";  
    document.getElementById("drugLic").value = "";  
    document.getElementById("gstin").value = "";  
  
    selectedProducts.clear();  
    renderProducts();  
}  
  
function captureLocation(){  
    const status = document.getElementById("locationStatus");  
  
    if (!navigator.geolocation) {  
        status.textContent = "Geolocation is not supported by this browser.";  
        return;  
    }  
  
    status.textContent = "Getting current location...";  
  
    navigator.geolocation.getCurrentPosition(  
        position => {  
            currentLocation.latitude = position.coords.latitude.toFixed(6);  
            currentLocation.longitude = position.coords.longitude.toFixed(6);  
  
            status.textContent =  
                `Location added: ${currentLocation.latitude}, ${currentLocation.longitude}`;  
  
            const memoLocation = document.getElementById("memoLocation");  
            if (memoLocation) {  
                memoLocation.textContent =  
                    `${currentLocation.latitude}, ${currentLocation.longitude}`;  
            }  
        },  
        error => {  
            let msg = "Unable to get location.";  
            if (error.code === 1) msg = "Location permission denied. Please allow location access.";  
            if (error.code === 2) msg = "Current location is unavailable.";  
            if (error.code === 3) msg = "Location request timed out.";  
  
            status.textContent = msg;  
        },  
        {  
            enableHighAccuracy: true,  
            timeout: 15000,  
            maximumAge: 0  
        }  
    );  
}  
  
function goToPage2(){  
    const party = document.getElementById("partyName").value.trim();  
    const mobile = document.getElementById("mobile").value.trim();  
  
    if (!party) {  
        alert("Party Name is required.");  
        document.getElementById("partyName").focus();  
        return;  
    }  
  
    if (!mobile || !/^\d{10}$/.test(mobile)) {  
        alert("A valid 10-digit Mobile No. is required.");  
        document.getElementById("mobile").focus();  
        return;  
    }  
  
    buildMemo();  
    document.getElementById("page1").classList.remove("active");  
    document.getElementById("page2").classList.add("active");  
    window.scrollTo(0,0);  
}  
  
function goToPage1(){  
    document.getElementById("page2").classList.remove("active");  
    document.getElementById("page1").classList.add("active");  
    window.scrollTo(0,0);  
}  
  
function buildMemo(){  
    const party = document.getElementById("partyName").value.trim() || "-";  
    const mobile = document.getElementById("mobile").value.trim() || "-";  
    const drugLic = document.getElementById("drugLic").value.trim() || "-";  
    const gstin = document.getElementById("gstin").value.trim() || "-";  
  
    document.getElementById("memoInfo").textContent =  
        `NAME  - ${party}  
Mo.   - ${mobile}  
DRUG LIC. - ${drugLic}  
GSTIN - ${gstin}`;  
  
    const memoItems = document.getElementById("memoItems");  
    memoItems.innerHTML = "";  
  
    if (selectedProducts.size === 0){  
        memoItems.innerHTML = '<div style="color:#777">No products selected.</div>';  
        return;  
    }  
  
    selectedProducts.forEach(item => {  
        const row = document.createElement("div");  
        row.className = "memo-item";  
  
        row.innerHTML = `  
            <div class="memo-main">  
                <div class="memo-product">${escapeHtml(item.name)}</div>  
                <div class="memo-price">${escapeHtml(String(item.qty || "0"))}</div>  
            </div>  
            <div class="memo-remark">  
                Remark. ${item.remark ? escapeHtml(item.remark) : ""}${item.rate !== "" ? `&nbsp;&nbsp;&nbsp; ₹ ${Number(item.rate).toFixed(2)}` : ""}  
            </div>  
        `;  
  
        memoItems.appendChild(row);  
    });  
}  
  
function sendWhatsApp(){  
    buildMemo();  
  
    const party = document.getElementById("partyName").value.trim() || "-";  
  
    let message =  
`SHANKER MEDICAL AGENCY  
  
NAME - ${party}  
Mo. - ${document.getElementById("mobile").value.trim() || "-"}  
DRUG LIC. - ${document.getElementById("drugLic").value.trim() || "-"}  
GSTIN - ${document.getElementById("gstin").value.trim() || "-"}  
  
PRODUCT                         QTY`;  
  
    selectedProducts.forEach(item => {  
        message += `\n${item.name}    ${item.qty || "0"}`;  
        if (item.rate !== "") message += ` @ ₹${Number(item.rate).toFixed(2)}`;  
        if (item.remark) message += `\n${item.remark}`;  
    });  
  
    message += `\n\nLOCATION\n${currentLocation.latitude && currentLocation.longitude  
        ? currentLocation.latitude + ", " + currentLocation.longitude  
        : "Not added"}`;  
  
    const url = `https://wa.me/918948475924?text=${encodeURIComponent(message)}`;  
    window.open(url, "_blank");  
}  
  
function escapeHtml(value){  
    return String(value)  
        .replaceAll("&","&amp;")  
        .replaceAll("<","&lt;")  
        .replaceAll(">","&gt;")  
        .replaceAll('"',"&quot;")  
        .replaceAll("'","&#039;");  
}  
  
function escapeAttr(value){  
    return escapeHtml(value);  
}  
  
renderProducts();  
</script>  
</body>  
</html>
