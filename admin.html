<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pause And Play - Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<a href="javascript:history.back()" class="back-btn">← Back</a>

<div class="container">

<div class="card">

<h1>🎮 Dashboard</h1>

<p>Pause And Play Gaming Cafe</p>

</div>


<div class="card">

<h2>Statistics</h2>

<table>

<tr>
<th>Total Members</th>
<td id="total">0</td>
</tr>

<tr>
<th>Active Members</th>
<td id="active">0</td>
</tr>

<tr>
<th>Today's Attendance</th>
<td id="todayAttendance">0</td>
</tr>

</table>

</div>


<div class="card">

<h2>Members</h2>

<button onclick="location.href='addmember.html'">

➕ Add Member

</button>

<button onclick="location.href='members.html'">

👥 Member List

</button>

<button onclick="location.href='attendance.html'">

✅ Attendance

</button>

</div>


<div class="card">

<h2>Membership</h2>

<button onclick="location.href='renew.html'">

🔄 Renew Membership

</button>

<button onclick="location.href='search.html'">

🔍 Search Member

</button>

<button onclick="location.href='reports.html'">

📊 Reports

</button>

</div>


<div class="card">

<h2>QR System</h2>

<button onclick="location.href='scan.html'">

📷 Scan QR

</button>

<button onclick="location.href='qr.html'">

🪪 Generate QR

</button>

</div>


<div class="card">

<h2>Settings</h2>

<button onclick="location.href='settings.html'">

⚙ Settings

</button>

</div>

</div>


<script src="api.js"></script>

<script>

async function loadDashboard(){

try{

const data=await dashboardAPI();

document.getElementById("total").innerHTML=data.total||0;

document.getElementById("active").innerHTML=data.active||0;

document.getElementById("todayAttendance").innerHTML=data.today||0;

}catch(e){

console.log(e);

}

}

loadDashboard();

</script>

</body>

</html>
