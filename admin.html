<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Pause & Play</title>
  
  <!-- Boxicons for iOS-Style Visual Icons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --ios-bg: #F2F2F7;
      --ios-card-bg: rgba(255, 255, 255, 0.82);
      --ios-blur: blur(20px);
      --ios-border: rgba(255, 255, 255, 0.5);
      --ios-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.06);
      --ios-radius: 20px;
      --ios-blue: #007AFF;
      --ios-green: #34C759;
      --ios-orange: #FF9500;
      --ios-red: #FF3B30;
      --ios-text: #1C1C1E;
      --ios-text-sub: #8E8E93;
    }

    body.dark {
      --ios-bg: #000000;
      --ios-card-bg: rgba(28, 28, 30, 0.82);
      --ios-border: rgba(255, 255, 255, 0.1);
      --ios-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --ios-text: #FFFFFF;
      --ios-text-sub: #8E8E93;
    }

    body {
      background-color: var(--ios-bg);
      color: var(--ios-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding-bottom: 85px;
    }

    /* Top Bar Header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--ios-card-bg);
      backdrop-filter: var(--ios-blur);
      -webkit-backdrop-filter: var(--ios-blur);
      border-bottom: 1px solid var(--ios-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .topbar .logo img {
      border-radius: 10px;
      object-fit: cover;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ios {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-border);
      color: var(--ios-text);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: var(--ios-blur);
      transition: all 0.2s ease;
    }

    .btn-ios:active {
      transform: scale(0.96);
    }

    .btn-ios.primary {
      background: var(--ios-blue);
      color: #FFFFFF;
      border: none;
    }

    .btn-ios.danger {
      color: var(--ios-red);
    }

    /* Layout & Cards */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .ios-card {
      background: var(--ios-card-bg);
      backdrop-filter: var(--ios-blur);
      -webkit-backdrop-filter: var(--ios-blur);
      border: 1px solid var(--ios-border);
      box-shadow: var(--ios-shadow);
      border-radius: var(--ios-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .metric-card h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--ios-text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-card h1 {
      margin: 12px 0 0 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    /* Quick Action Shortcuts Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      border-radius: var(--ios-radius);
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-border);
      color: var(--ios-text);
      cursor: pointer;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: var(--ios-shadow);
      transition: all 0.2s ease;
    }

    .action-card i {
      font-size: 28px;
      color: var(--ios-blue);
    }

    .action-card:active {
      transform: scale(0.95);
    }

    /* iOS Mobile Bottom Bar */
    .ios-tab-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--ios-card-bg);
      backdrop-filter: var(--ios-blur);
      -webkit-backdrop-filter: var(--ios-blur);
      border-top: 1px solid var(--ios-border);
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding-bottom: 12px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--ios-text-sub);
      text-decoration: none;
      font-size: 10px;
      gap: 3px;
    }

    .tab-item i {
      font-size: 22px;
    }

    .tab-item.active {
      color: var(--ios-blue);
    }

    @media (max-width: 768px) {
      .ios-tab-bar {
        display: flex;
      }
      .actions-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>

  <!-- Inline Auth Check -->
  <script>
    if (localStorage.getItem("loggedIn") !== "true" && !sessionStorage.getItem("gym_user")) {
      location.href = "login.html";
    }
  </script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="topbar">
    <div class="logo">
      <img src="assets/logo.png" height="38" alt="Pause & Play Logo" onerror="this.style.display='none'">
      <span>Pause & Play</span>
    </div>

    <div class="header-actions">
      <button class="btn-ios primary" onclick="window.open('billing.html', '_blank')">
        <i class='bx bx-credit-card'></i> Billing
      </button>
      <button class="btn-ios danger" onclick="logout()">
        <i class='bx bx-log-out'></i> Logout
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <h1 class="page-title">Dashboard</h1>

    <!-- Metrics Cards -->
    <div class="metrics-grid">
      <div class="ios-card metric-card">
        <h3>Total Members</h3>
        <h1 id="total">0</h1>
      </div>

      <div class="ios-card metric-card">
        <h3>Active Members</h3>
        <h1 id="active" style="color: var(--ios-green);">0</h1>
      </div>

      <div class="ios-card metric-card">
        <h3>Today's Attendance</h3>
        <h1 id="today" style="color: var(--ios-blue);">0</h1>
      </div>

      <div class="ios-card metric-card">
        <h3>Expired Members</h3>
        <h1 id="expired" style="color: var(--ios-red);">0</h1>
      </div>
    </div>

    <!-- Navigation Shortcuts -->
    <div class="actions-grid">
      <button class="action-card" onclick="location.href='addmember.html'">
        <i class='bx bx-user-plus'></i>
        <span>Add Member</span>
      </button>

      <button class="action-card" onclick="location.href='members.html'">
        <i class='bx bx-group'></i>
        <span>Members</span>
      </button>

      <button class="action-card" onclick="location.href='scanner.html'">
        <i class='bx bx-qr-scan'></i>
        <span>Scan QR</span>
      </button>

      <button class="action-card" onclick="location.href='attendance.html'">
        <i class='bx bx-calendar-check'></i>
        <span>Attendance</span>
      </button>

      <button class="action-card" onclick="location.href='reports.html'">
        <i class='bx bx-bar-chart-alt-2'></i>
        <span>Reports</span>
      </button>

      <button class="action-card" onclick="location.href='settings.html'">
        <i class='bx bx-cog'></i>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <!-- Mobile Bottom Tab Navigation -->
  <nav class="ios-tab-bar">
    <a href="dashboard.html" class="tab-item active">
      <i class='bx bx-home-alt'></i>
      <span>Home</span>
    </a>
    <a href="members.html" class="tab-item">
      <i class='bx bx-group'></i>
      <span>Members</span>
    </a>
    <a href="attendance.html" class="tab-item">
      <i class='bx bx-calendar'></i>
      <span>Attendance</span>
    </a>
    <a href="billing.html" class="tab-item">
      <i class='bx bx-receipt'></i>
      <span>Billing</span>
    </a>
  </nav>

  <!-- External JavaScript Files -->
  <script src="api.js"></script>
  <script src="app.js"></script>

  <script>
    async function loadDashboard() {
      try {
        let d = await getDashboard();
        if (d) {
          document.getElementById("total").innerText = d.total || 0;
          document.getElementById("active").innerText = d.active || 0;
          document.getElementById("today").innerText = d.today || 0;
          document.getElementById("expired").innerText = d.expired || 0;
        }
      } catch (err) {
        console.error("Error loading dashboard data:", err);
      }
    }

    function logout() {
      if (confirm("Are you sure you want to logout?")) {
        localStorage.removeItem("loggedIn");
        sessionStorage.clear();
        location.href = "login.html";
      }
    }

    document.addEventListener("DOMContentLoaded", loadDashboard);
  </script>
</body>
</html>
