<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
if(localStorage.getItem("loggedIn")!="true"){
location.href="login.html";
}
</script>
<div class="container">
<div class="card">
<h1>Pause And Play</h1>
<button onclick="location.href='addmember.html'">
➕ Add Member
</button>
<button onclick="location.href='members.html'">
👥 Members
</button>
<button onclick="location.href='scanner.html'">
📷 Scan QR
</button>
<button onclick="location.href='attendance.html'">
📋 Attendance
</button>
  <button onclick="logout()">
Logout🚫
</button>
</div>
<div class="card">
<h2>Total Members</h2>
<h1 id="total">0</h1>
</div>
<div class="card">
<h2>Active Members</h2>
<h1 id="active">0</h1>
</div>
</div>
<script src="api.js"></script>
<script>
async function load(){
let data=await getDashboard();
document.getElementById("total")
.innerHTML=data.total;
document.getElementById("active")
.innerHTML=data.active;
}
load();
</script>
</body>
</html>
