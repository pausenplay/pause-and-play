<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanker Medical Agency</title>
<style>
    * { box-sizing: border-box; }

    :root{
        --green:#8fe044;
        --green-dark:#70b72d;
        --border:#111;
        --light:#f7f7f7;
        --gray:#dcdcdc;
    }

    body{
        margin:0;
        background:#000;
        font-family:Arial, Helvetica, sans-serif;
        color:#000;
    }

    .app{
        width:min(100%, 760px);
        margin:0 auto;
        min-height:100vh;
        background:#fff;
        overflow:hidden;
    }

    .page{
        display:none;
        min-height:100vh;
        padding:34px 34px 30px;
    }

    .page.active{ display:block; }

    .brand{
        text-align:center;
        font-size:clamp(28px, 6vw, 48px);
        font-weight:900;
        letter-spacing:-2px;
        line-height:1;
        margin:8px 0 48px;
        text-shadow:3px 4px 2px #777;
    }

    .field{
        width:100%;
        height:56px;
        border:3px solid var(--border);
        border-radius:14px;
        padding:0 18px;
        font-size:21px;
        outline:none;
        margin-bottom:17px;
        background:#fff;
    }

    .field:focus{
        border-color:#555;
        box-shadow:0 0 0 3px #ddd;
    }

    .product-select{
        margin-top:25px;
        margin-bottom:25px;
    }

    .product-list{
        display:flex;
        flex-direction:column;
        gap:20px;
        max-height:52vh;
        overflow-y:auto;
        padding-right:3px;
    }

    .product-card{
        border:3px solid #111;
        border-radius:14px;
        padding:18px;
        background:#fff;
    }

    .product-top{
        display:grid;
        grid-template-columns:1fr 220px;
        gap:18px;
        align-items:center;
    }

    .product-name{
        font-size:28px;
        font-weight:700;
        line-height:1.1;
        word-break:break-word;
    }

    .rate{
        height:50px;
        border:2px solid #777;
        border-radius:10px;
        padding:0 14px;
        width:100%;
        font-size:22px;
        font-weight:700;
        text-align:right;
    }

    .rate::placeholder{ color:#bbb; }

    .product-bottom{
        display:grid;
        grid-template-columns:270px 1fr;
        gap:18px;
        margin-top:15px;
        align-items:center;
    }

    .qty-control{
        display:flex;
        align-items:center;
        gap:10px;
    }

    .qty-btn{
        width:48px;
        height:48px;
        border-radius:10px;
        border:2px solid #888;
        font-size:30px;
        font-weight:900;
        cursor:pointer;
        line-height:1;
    }

    .minus{ background:#ff1111; color:#000; }
    .plus{ background:var(--green); color:#000; }

    .qty{
        width:62px;
        height:46px;
        border:2px solid #888;
        border-radius:8px;
        text-align:center;
        font-size:20px;
        font-weight:700;
    }

    .unit{
        font-size:25px;
        font-weight:700;
    }

    .scheme{
        height:50px;
        border:2px solid #aaa;
        border-radius:10px;
        padding:0 14px;
        font-size:18px;
        width:100%;
    }

    .buttons{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:45px;
        margin-top:45px;
    }

    button.main-btn{
        height:72px;
        border-radius:15px;
        border:2px solid #999;
        font-size:32px;
        font-weight:800;
        cursor:pointer;
        box-shadow:inset 0 1px 2px #fff, 0 2px 3px #777;
    }

    .clear-btn{ background:#ddd; }
    .next-btn,.whatsapp-btn{ background:var(--green); }

    /* Page 2 */
    #page2{
        padding:48px 42px 34px;
    }

    #page2 .brand{
        margin-bottom:54px;
    }

    .memo-box{
        border:3px solid #111;
        border-radius:17px;
        padding:38px 32px;
        min-height:700px;
        font-family:"Courier New", monospace;
        font-size:22px;
    }

    .memo-info{
        line-height:1.75;
        white-space:pre-wrap;
    }

    .separator{
        border-top:3px dashed #111;
        margin:17px 0;
    }

    .memo-head{
        display:grid;
        grid-template-columns:1fr 120px;
        font-weight:700;
        margin-bottom:8px;
    }

    .memo-item{
        margin:8px 0 0;
    }

    .memo-main{
        display:grid;
        grid-template-columns:minmax(0,1fr) 145px;
        gap:10px;
        line-height:1.35;
    }

    .memo-product{
        overflow-wrap:anywhere;
    }

    .memo-price{
        text-align:right;
    }

    .memo-remark{
        font-size:18px;
        padding-left:2px;
        margin-bottom:8px;
        overflow-wrap:anywhere;
    }

    .page2-buttons{
        margin-top:48px;
    }

    .empty{
        text-align:center;
        color:#777;
        padding:50px 10px;
        font-family:Arial, sans-serif;
    }

    @media(max-width:650px){
        .page{ padding:25px 18px; }
        .brand{ margin-bottom:35px; }
        .product-top,
        .product-bottom{
            grid-template-columns:1fr;
        }
        .product-bottom{ gap:12px; }
        .product-list{ max-height:none; }
        .buttons{ gap:15px; }
        button.main-btn{ font-size:24px; }
        .memo-box{
            padding:24px 18px;
            font-size:16px;
            min-height:600px;
        }
        .memo-main{
            grid-template-columns:minmax(0,1fr) 105px;
        }
    }
</style>
</head>

<body>
<div class="app">

    <!-- PAGE 1 -->
    <section id="page1" class="page active">
        <div class="brand">SHANKER MEDICAL AGENCY</div>

        <input id="partyName" class="field" placeholder="PARTY NAME *" autocomplete="off" required>
        <input id="mobile" class="field" placeholder="MOBILE No. *" inputmode="numeric" maxlength="10" required>
        <input id="drugLic" class="field" placeholder="Drug Lic." autocomplete="off">
        <input id="gstin" class="field" placeholder="GSTIN" autocomplete="off">

        <button type="button" class="main-btn next-btn" style="width:100%;height:58px;font-size:22px;margin:5px 0 18px;" onclick="captureLocation()">
            Add Location
        </button>
        <div id="locationStatus" style="text-align:center;font-size:16px;margin:-8px 0 18px;color:#555;">
            Location not added
        </div>

        <select id="productSelect" class="field product-select">
            <option value="">Select Product</option>
        </select>

        <div id="productList" class="product-list"></div>

        <div class="buttons">
            <button class="main-btn clear-btn" onclick="clearAll()">Clear</button>
            <button class="main-btn next-btn" onclick="goToPage2()">Next</button>
        </div>
    </section>

    <!-- PAGE 2 -->
    <section id="page2" class="page">
        <div class="brand">SHANKER MEDICAL AGENCY</div>

        <div class="memo-box">
            <div id="memoInfo" class="memo-info"></div>

            <div class="separator"></div>

            <div class="memo-head">
                <div>PRODUCT</div>
                <div>QTY</div>
            </div>

            <div class="separator"></div>

            <div id="memoItems"></div>

            <div class="separator"></div>
            <div>LOCATION</div>
            <div id="memoLocation" style="margin-top:6px;">Not added</div>
        </div>

        <div class="buttons page2-buttons">
            <button class="main-btn clear-btn" onclick="goToPage1()">Back</button>
            <button class="main-btn whatsapp-btn" onclick="sendWhatsApp()">Whatsapp</button>
        </div>
    </section>

</div>

<script>
const products = [
    "CASSEROLE O 1500ML",
    "DICLOWIN ACTIVE CREAM 50G",
    "DICLOWIN CARBOFAST GEL 15GM",
    "DICLOWIN CARBOFAST GEL 35GM",
    "DICLOWIN D3 MANGO NOSHOTS 5ML",
    "DICLOWIN KNEE OIL 60ML",
    "DICLOWIN KNEE OIL. 60ML",
    "DICLOWIN MR SPRAY 25GM",
    "DICLOWIN MR SPRAY 40GM",
    "DICLOWIN ORTHO GEL 5GM",
    "DICLOWIN PERIOD ROLL ON 10ML",
    "DICLOWIN PLUS 10'S",
    "DICLOWIN PLUS MR 10'S",
    "DICLOWIN PLUS SP 10'S",
    "DICLOWIN ROLL ON 10ML",
    "HAIR SHEILD SHAMPOO 60ML",
    "HAIR SHIELD ANTI LICE 30ML",
    "HAIR SHIELD BIOTIN 60'S",
    "HANDEEZ BABY 99% WATER WIPES 72'S",
    "HANDEEZ WIPES 72'S",
    "HEELMATE 30GM",
    "KUFMA RED 10'S",
    "LARLA RABEDSR 10'S",
    "MILTON OLIVE 200ML",
    "ORASORE 10'S",
    "ORASORE DENTAL GEL 10GM",
    "ORASORE DENTAL+ WHITEPASTE INS 6'S",
    "ORASORE ELACHIZING SPRAY 15G",
    "ORASORE GEL 10GM",
    "ORASORE ORS APPLE 200ML",
    "ORASORE ORS ORANGE 200ML",
    "ORASORE PAANZING SPRAY 15GM",
    "ORASORE STAIN REMOVAL T/P 100GM",
    "ORASORE SUPER SAUF 15G",
    "ORASORE WHITENING T/P 50GM",
    "ORASORE WHITENING T/P 75G",
    "WINCOLD NASAL SPRAY 10ML",
    "WINCOLD Z 10'S",
    "XICOTINE 2 MINT 10'S",
    "XITCH CR. 15G"
];

const selectedProducts = new Map();
let currentLocation = { latitude: "", longitude: "" };

const select = document.getElementById("productSelect");
const productList = document.getElementById("productList");

products.forEach((name, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = name;
    select.appendChild(option);
});

select.addEventListener("change", () => {
    const index = select.value;
    if (index === "") return;

    const name = products[Number(index)];

    if (!selectedProducts.has(index)) {
        selectedProducts.set(index, {
            name,
            qty: 1,
            rate: "",
            remark: ""
        });
        renderProducts();
    }

    select.value = "";
});

function renderProducts(){
    productList.innerHTML = "";

    if (selectedProducts.size === 0) {
        productList.innerHTML = '<div class="empty">Select a product to add it to the memo.</div>';
        return;
    }

    selectedProducts.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.dataset.index = index;

        card.innerHTML = `
            <div class="product-top">
                <div class="product-name">${escapeHtml(item.name)}</div>
                <input
                    class="rate"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="RATE if any"
                    value="${item.rate}"
                    oninput="updateRate('${index}', this.value)"
                >
            </div>

            <div class="product-bottom">
                <div class="qty-control">
                    <button class="qty-btn minus" onclick="changeQty('${index}', -0.5)">−</button>
                    <input
                        class="qty"
                        type="number"
                        min="0.5"
                        step="0.5"
                        value="${item.qty}"
                        onchange="setQty('${index}', this.value)"
                    >
                    <button class="qty-btn plus" onclick="changeQty('${index}', 0.5)">+</button>
                    <span class="unit">box</span>
                </div>

                <input
                    class="scheme"
                    placeholder="Remark"
                    value="${escapeAttr(item.remark)}"
                    oninput="updateRemark('${index}', this.value)"
                >
            </div>
        `;

        productList.appendChild(card);
    });
}

function changeQty(index, amount){
    const item = selectedProducts.get(index);
    if (!item) return;

    item.qty = Math.max(0.5, Number((item.qty + amount).toFixed(2)));
    renderProducts();
}

function setQty(index, value){
    const item = selectedProducts.get(index);
    if (!item) return;

    let qty = parseFloat(value);
    if (!Number.isFinite(qty) || qty < 0.5) qty = 0.5;

    // Keep quantity in 0.5 increments.
    qty = Math.round(qty * 2) / 2;
    item.qty = qty;
    renderProducts();
}

function updateRate(index, value){
    const item = selectedProducts.get(index);
    if (item) item.rate = value;
}

function updateRemark(index, value){
    const item = selectedProducts.get(index);
    if (item) item.remark = value;
}

function clearAll(){
    if (!confirm("Clear party details and all selected products?")) return;

    document.getElementById("partyName").value = "";
    document.getElementById("mobile").value = "";
    document.getElementById("drugLic").value = "";
    document.getElementById("gstin").value = "";

    selectedProducts.clear();
    renderProducts();
}

function captureLocation(){
    const status = document.getElementById("locationStatus");

    if (!navigator.geolocation) {
        status.textContent = "Geolocation is not supported by this browser.";
        return;
    }

    status.textContent = "Getting current location...";

    navigator.geolocation.getCurrentPosition(
        position => {
            currentLocation.latitude = position.coords.latitude.toFixed(6);
            currentLocation.longitude = position.coords.longitude.toFixed(6);

            status.textContent =
                `Location added: ${currentLocation.latitude}, ${currentLocation.longitude}`;

            const memoLocation = document.getElementById("memoLocation");
            if (memoLocation) {
                memoLocation.textContent =
                    `${currentLocation.latitude}, ${currentLocation.longitude}`;
            }
        },
        error => {
            let msg = "Unable to get location.";
            if (error.code === 1) msg = "Location permission denied. Please allow location access.";
            if (error.code === 2) msg = "Current location is unavailable.";
            if (error.code === 3) msg = "Location request timed out.";

            status.textContent = msg;
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

function goToPage2(){
    const party = document.getElementById("partyName").value.trim();
    const mobile = document.getElementById("mobile").value.trim();

    if (!party) {
        alert("Party Name is required.");
        document.getElementById("partyName").focus();
        return;
    }

    if (!mobile || !/^\\d{10}$/.test(mobile)) {
        alert("A valid 10-digit Mobile No. is required.");
        document.getElementById("mobile").focus();
        return;
    }

    buildMemo();
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
    window.scrollTo(0,0);
}

function goToPage1(){
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page1").classList.add("active");
    window.scrollTo(0,0);
}

function buildMemo(){
    const party = document.getElementById("partyName").value.trim() || "-";
    const mobile = document.getElementById("mobile").value.trim() || "-";
    const drugLic = document.getElementById("drugLic").value.trim() || "-";
    const gstin = document.getElementById("gstin").value.trim() || "-";

    document.getElementById("memoInfo").textContent =
        `NAME  - ${party}
Mo.   - ${mobile}
DRUG LIC. - ${drugLic}
GSTIN - ${gstin}`;

    const memoItems = document.getElementById("memoItems");
    memoItems.innerHTML = "";

    if (selectedProducts.size === 0){
        memoItems.innerHTML = '<div style="color:#777">No products selected.</div>';
        return;
    }

    selectedProducts.forEach(item => {
        const row = document.createElement("div");
        row.className = "memo-item";

        const priceText = item.rate !== ""
            ? ` @ ₹ ${Number(item.rate).toFixed(2)}`
            : "";

        row.innerHTML = `
            <div class="memo-main">
                <div class="memo-product">${escapeHtml(item.name)}</div>
                <div class="memo-price">${escapeHtml(String(item.qty))} BOX</div>
            </div>
            <div class="memo-remark">
                Remark. ${item.remark ? escapeHtml(item.remark) : ""}${item.rate !== "" ? `&nbsp;&nbsp;&nbsp; ₹ ${Number(item.rate).toFixed(2)}` : ""}
            </div>
        `;

        memoItems.appendChild(row);
    });
}

function sendWhatsApp(){
    buildMemo();

    const party = document.getElementById("partyName").value.trim() || "-";

    let message =
`SHANKER MEDICAL AGENCY

NAME - ${party}
Mo. - ${document.getElementById("mobile").value.trim() || "-"}
DRUG LIC. - ${document.getElementById("drugLic").value.trim() || "-"}
GSTIN - ${document.getElementById("gstin").value.trim() || "-"}

PRODUCT                         QTY`;

    selectedProducts.forEach(item => {
        message += `\n${item.name}    ${item.qty} BOX`;
        if (item.rate !== "") message += ` @ ₹${Number(item.rate).toFixed(2)}`;
        if (item.remark) message += `\n${item.remark}`;
    });

    message += `\n\nLOCATION\n${currentLocation.latitude && currentLocation.longitude
        ? currentLocation.latitude + ", " + currentLocation.longitude
        : "Not added"}`;

    // WhatsApp recipient is fixed to 8948475924.
    const url = `https://wa.me/918948475924?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttr(value){
    return escapeHtml(value);
}

renderProducts();
</script>
</body>
</html>
