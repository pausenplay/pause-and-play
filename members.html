<!DOCTYPE html>
<html>

<head>

<title>Members</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<a href="javascript:history.back()" class="back-btn">← Back</a>

<div class="container">

<div class="card">

<h1>Members</h1>

<input id="search" placeholder="Search Member ID / Name" onkeyup="loadMembers()">

<div id="list"></div>

</div>

</div>


<script src="api.js"></script>

<script>

async function loadMembers(){

let members=await getMembers();

let search=document.getElementById("search").value.toLowerCase();


let html="";


members.forEach(m=>{


if(
m.memberid.toLowerCase().includes(search) ||
m.name.toLowerCase().includes(search)
){


html += `

<div class="card">

<h2>${m.name}</h2>

<p>ID: ${m.memberid}</p>

<p>Plan: ${m.plan}</p>

<p>Expiry: ${m.expiry}</p>

<p>Status: ${m.status}</p>


<button onclick="location.href='member.html?id=${m.memberid}'">

View

</button>


<button onclick="location.href='editmember.html?id=${m.memberid}'">

Edit

</button>


<button onclick="location.href='renew.html?id=${m.memberid}'">

Renew

</button>


<button onclick="location.href='qr.html?id=${m.memberid}'">

QR

</button>


</div>

`;

}

});


document.getElementById("list").innerHTML=html;

}


loadMembers();

</script>

</body>

</html>
