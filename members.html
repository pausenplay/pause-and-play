<!DOCTYPE html>
<html>
<head>
<title>Member List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="index.html" class="home-btn">🏠 Home</a>
  <h1>Member List</h1>
<hr>
<table border="1" width="100%" id="memberTable">
<tr>
  <th>Member ID</th>
  <th>Name</th>
  <th>Mobile</th>
  <th>Plan</th>
  <th>Start Date</th>
  <th>QR</th>
</tr>
</table>
<script>
let members = JSON.parse(localStorage.getItem("members")) || [];
let table = document.getElementById("memberTable");
members.forEach(function(member){
table.innerHTML += `
<tr>
<td>${member.memberid}</td>
<td>${member.name}</td>
<td>${member.mobile}</td>
<td>${member.plan}</td>
<td>${member.startdate}</td>
<td>
<button onclick="location.href='qr.html?id=${member.memberid}'">
QR
</button>
</td>
</tr>
`;
});
</script>
</body>

</html>
