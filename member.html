<!DOCTYPE html>
<html>

<head>

<title>Member</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<a href="javascript:history.back()" class="back-btn">← Back</a>

<div class="container">

<div class="card">

<h1 id="name"></h1>

<p id="memberid"></p>

<p id="mobile"></p>

<p id="plan"></p>

<p id="expiry"></p>

<p id="status"></p>

</div>

</div>

<script src="api.js"></script>

<script>
async function loadMember(){
const id=new URLSearchParams(location.search).get("id");
await attendanceAPI(id);
const m=await getMemberAPI(id);
document.getElementById("name").innerHTML=m.name;
document.getElementById("memberid").innerHTML="ID : "+m.memberid;
document.getElementById("mobile").innerHTML="Mobile : "+m.mobile;
document.getElementById("plan").innerHTML="Plan : "+m.plan;
document.getElementById("expiry").innerHTML="Expiry : "+m.expiry;
document.getElementById("status").innerHTML="Status : "+m.status;
}
loadMember();
</script>
</body>
</html>
